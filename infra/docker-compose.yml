services:
  # PostgreSQL 16 with PostGIS 3.4 Spatial Engine
  db:
    image: postgis/postgis:16-3.4
    container_name: land_registry_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_registry}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d land_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Private Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: land_registry_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
